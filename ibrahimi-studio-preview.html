<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ibrahimi AI Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#101b24;color:#f5f9ff;font-family:Tahoma,Arial}header{padding:18px;text-align:center;background:#203747;color:#9affca}main{max-width:1100px;margin:auto;padding:16px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}label,button{background:#244353;border:1px solid #6397a3;border-radius:12px;padding:12px;cursor:pointer;color:white}input[type=file]{max-width:230px}button{background:#167a57}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;border:4px solid #67939e;border-radius:18px;background:radial-gradient(ellipse at center,#567b89,#172d3a 75%)}.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.speaker{position:absolute;left:32%;top:9%;width:36%;height:78%;object-fit:contain;z-index:2;cursor:move}.desk{position:absolute;bottom:0;left:16%;width:68%;height:26%;background:linear-gradient(110deg,#9e6c3d,#e6b980,#80502b);border:5px solid #59341b;border-radius:55% 55% 8px 8px/32% 32% 8px 8px;z-index:3;pointer-events:none}.hint{font-size:13px;color:#b7cdd6}input[type=range]{vertical-align:middle}footer{padding:16px;text-align:center;color:#b5cbd2}</style><header><h2>استودیوی هوشمند ابراهیمی — نسخه آزمایشی</h2></header><main><div class="controls"><label>ویدیوی استودیو <input id="bg" type="file" accept="video/*"></label><label>ویدیوی گوینده <input id="person" type="file" accept="video/*,image/*"></label><button id="play">پخش / توقف</button><button id="reset">تنظیم مجدد</button></div><div class="controls"><label>اندازه گوینده <input id="size" type="range" min="15" max="85" value="36"></label><label>ارتفاع میز <input id="height" type="range" min="10" max="50" value="26"></label><label>حذف رنگ سبز پس‌زمینه <input id="key" type="checkbox"></label></div><div class="stage" id="stage"><video id="background" muted loop playsinline></video><video id="speaker" class="speaker" playsinline loop></video><div id="desk" class="desk"></div></div><p class="hint">ویدیوها از حافظه دستگاه انتخاب می‌شوند و به سرور ارسال نمی‌شوند. گوینده را با لمس یا موس جابه‌جا کنید. حذف واقعی پس‌زمینه با هوش مصنوعی در این نسخه فعال نیست؛ گزینه رنگ سبز صرفاً آزمایشی است.</p></main><footer>Ibrahimi AI Studio · آزمایش مستقل</footer><script>const $=x=>document.getElementById(x),urls=[];function load(id,target){$(id).onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);urls.push(u);let v=$(target);if(f.type.startsWith('image/')){v.style.display='none';let img=$('portrait');if(!img){img=document.createElement('img');img.id='portrait';img.className='speaker';$('stage').insertBefore(img,$('desk'));drag(img)}img.src=u;img.style.display='block'}else{if(target==='speaker'&&$('portrait'))$('portrait').style.display='none';v.src=u;v.style.display='block';v.play().catch(()=>{})}}}load('bg','background');load('person','speaker');$('play').onclick=()=>{for(let id of ['background','speaker']){let v=$(id);if(v.src){if(v.paused)v.play().catch(()=>{});else v.pause()}}};$('size').oninput=e=>{document.querySelectorAll('.speaker').forEach(v=>v.style.width=e.target.value+'%')};$('height').oninput=e=>$('desk').style.height=e.target.value+'%';$('reset').onclick=()=>{document.querySelectorAll('.speaker').forEach(v=>{v.style.left='32%';v.style.top='9%';v.style.width='36%'});$('size').value=36;$('height').value=26;$('desk').style.height='26%'};function drag(el){let sx,sy,l,t;el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;l=el.offsetLeft;t=el.offsetTop;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId))return;let r=$('stage').getBoundingClientRect();el.style.left=Math.max(0,Math.min(r.width-el.offsetWidth,l+e.clientX-sx))/r.width*100+'%';el.style.top=Math.max(0,Math.min(r.height-el.offsetHeight,t+e.clientY-sy))/r.height*100+'%'})}drag($('speaker'));$('key').onchange=e=>alert('حذف واقعی پس‌زمینه در این نمونه هنوز پیاده‌سازی نشده است.');</script></html>
